name: Φτιάξε το NLexi APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

              - uses: android-actions/setup-android@v3
           with:
             packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Εγκατάσταση
        run: npm install

      - name: Δημιουργία project Android
        run: |
          npm run prepare:web
          npx cap add android
          node scripts/patch-android.mjs
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Σταθερό κλειδί υπογραφής (για να γίνονται ενημερώσεις χωρίς απεγκατάσταση)
        run: |
          mkdir -p ~/.android
          cp android-keys/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NLexi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NLexi-apk
          path: NLexi.apk

      - name: Δημοσίευση στα Releases (για εύκολο κατέβασμα από το κινητό)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NLexi.apk --title "NLexi — τελευταία έκδοση" --notes "Χτίστηκε $(date -u '+%Y-%m-%d %H:%M') UTC. Κατέβασε το NLexi.apk από το κινητό σου."
